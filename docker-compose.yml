services:

  # ── Database ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── SonarQube ──────────────────────────────────────────────────────────────
  sonarqube:
    image: sonarqube:10-community
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://postgres:5432/sonarqube
      SONAR_JDBC_USERNAME: ${POSTGRES_USER:-admin}
      SONAR_JDBC_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "9000:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_extensions:/opt/sonarqube/extensions
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  # ── MLflow ─────────────────────────────────────────────────────────────────
  mlflow:
    build: ./mlflow
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/mlflow
      MLFLOW_ARTIFACT_ROOT: /mlflow/artifacts
    ports:
      - "5001:5000"
    volumes:
      - mlflow_artifacts:/mlflow/artifacts
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s=socket.socket(); s.connect(('localhost',5000)); s.close()\""]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── Langfuse ───────────────────────────────────────────────────────────────
  langfuse:
    image: langfuse/langfuse:2
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/langfuse
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${LANGFUSE_SECRET:-changeme_random_32chars}
      SALT: ${LANGFUSE_SALT:-changeme_random_32chars}
      TELEMETRY_ENABLED: "false"
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "false"
      LANGFUSE_INIT_ORG_ID: capstone-org
      LANGFUSE_INIT_ORG_NAME: TechDebt AI
      LANGFUSE_INIT_PROJECT_ID: capstone-project
      LANGFUSE_INIT_PROJECT_NAME: TechDebt AI Dashboard
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_INIT_USER_EMAIL: admin@techdebt.local
      LANGFUSE_INIT_USER_NAME: Admin
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD:-changeme_local_pw123}
    ports:
      - "3001:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://$(hostname):3000/api/public/health"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ── Backend (FastAPI) ──────────────────────────────────────────────────────
  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_healthy
      langfuse:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/appdb
      SONARQUBE_URL: http://sonarqube:9000
      SONARQUBE_TOKEN: ${SONARQUBE_TOKEN:-}
      MLFLOW_TRACKING_URI: http://mlflow:5000
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: http://langfuse:3000
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      OLLAMA_HOST: http://ollama:11434
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      TARGET_REPO: ${TARGET_REPO:-expressjs/express}
      SSL_VERIFY: "false"
      PYTHONHTTPSVERIFY: "0"
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - /var/run/docker.sock:/var/run/docker.sock
      - ./scanner:/scanner-build:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── Frontend (Vue + Nginx) ─────────────────────────────────────────────────
  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"

  # ── Ollama (local LLM) ────────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates-custom.crt
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
      - ./certs/ca-bundle.pem:/etc/ssl/certs/ca-certificates-custom.crt:ro
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 15s

  # Pull llama3.2:3b on first startup; runs once then exits
  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama"]
    command: ["pull", "--insecure", "llama3.2:3b"]
    restart: "no"

  # ── Scanner (one-shot) ────────────────────────────────────────────────────
  scanner:
    build: ./scanner
    profiles:
      - scan
    environment:
      SONAR_HOST_URL: http://sonarqube:9000
      SONAR_TOKEN: ${SONARQUBE_TOKEN}
      TARGET_REPO: ${TARGET_REPO:-expressjs/express}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    depends_on:
      - sonarqube

volumes:
  postgres_data:
  mlflow_artifacts:
  sonarqube_data:
  sonarqube_logs:
  sonarqube_extensions:
  ollama_data:
